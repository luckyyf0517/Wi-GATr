# Wi3R dataset configuration for delay spread prediction
#
# This config inherits from the base wi3r config and overrides the target function
# to compute RMS delay spread from MPC data instead of received power.
#
# The target_scaling parameters below are approximate values. For accurate results,
# run scripts/compute_target_stats.py with target_data_fct=compute_delay_spread_from_mpc
#
# Usage:
#   uv run python scripts/train.py --config-name=wigatr_wi3r data=wi3r_delay_spread

defaults:
  - wi3r@_here_
  - _self_

# Override target function to compute delay spread from MPC
target_data_fct: compute_delay_spread_from_mpc

# Normalization parameters for delay spread (in nanoseconds)
# Computed from 1000 samples: mean=1.34, std=0.43, range=[0.16, 2.60]
target_scaling:
  mean: 1.3449
  std: 0.4286
  min: 0.1611
  max: 2.5986
